server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hospital_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${HOSPITAL_DB_USER:sa}
spring.datasource.password=${HOSPITAL_DB_PASSWORD:}
spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.thymeleaf.cache=true
